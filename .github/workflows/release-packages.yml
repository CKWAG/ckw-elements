name: Release Packages

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-packages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_PROVENANCE: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Extract version from release tag
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::Cannot extract version from tag '$GITHUB_REF_NAME'"
            exit 1
          fi
          echo "Release version: $VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set and verify package versions
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.value }}'
          [ -n "$VERSION" ] || { echo "::error::empty version output"; exit 1; }
          for dir in packages/tokens packages/icons packages/components; do
            ( cd "$dir" && pnpm pkg set version="$VERSION" )
            GOT=$(node -p "require('./$dir/package.json').version")
            if [ "$GOT" != "$VERSION" ]; then
              echo "::error::version not applied in $dir (got '$GOT', expected '$VERSION')"
              exit 1
            fi
            echo "$dir -> $GOT"
          done

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build packages
        run: |
          pnpm --filter @ckwag/elements-tokens run build
          pnpm --filter @ckwag/elements-icons run build
          pnpm --filter @ckwag/elements run build

      - name: Validate release
        run: node scripts/validate-release.mjs --publish

      - name: Publish to npm
        run: pnpm -r publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
