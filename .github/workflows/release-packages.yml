name: Release Packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-packages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_PROVENANCE: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build tokens
        run: pnpm --filter @ckwag/elements-tokens run build

      - name: Build components
        run: pnpm --filter @ckwag/elements run build

      - name: Build Storybook
        run: pnpm --filter @ckwag/elements-storybook run build
        env:
          STORYBOOK_BASE: /ckw-elements/

      - name: Validate release configuration
        run: pnpm release:check

      - name: Dry-run npm packages
        run: pnpm release:pack

      - name: Version or publish packages
        uses: changesets/action@v1
        with:
          version: pnpm version:packages
          publish: pnpm release:publish
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
