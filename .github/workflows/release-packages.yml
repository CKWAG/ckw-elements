name: Release Packages

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-packages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_PROVENANCE: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Extract version from release tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set package versions
        run: |
          pnpm --filter @ckwag/elements-tokens pkg set version=${{ steps.version.outputs.value }}
          pnpm --filter @ckwag/elements-icons pkg set version=${{ steps.version.outputs.value }}
          pnpm --filter @ckwag/elements pkg set version=${{ steps.version.outputs.value }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build packages
        run: |
          pnpm --filter @ckwag/elements-tokens run build
          pnpm --filter @ckwag/elements-icons run build
          pnpm --filter @ckwag/elements run build

      - name: Validate release
        run: node scripts/validate-release.mjs --publish

      - name: Publish to npm
        run: pnpm -r publish --no-git-checks --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
