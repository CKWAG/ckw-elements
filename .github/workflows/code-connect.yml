# Publish Figma Code Connect mappings after changes land on main.
# Needs the repository secret FIGMA_ACCESS_TOKEN (scopes: file_content:read, file_code_connect:write).

name: Code Connect

on:
  push:
    branches: [main]
    paths:
      - 'figma.config.json'
      - 'packages/components/src/**/*.figma.ts'
      - 'packages/icons/code-connect/**'
      - 'packages/icons/src/index.tsx'
      - 'scripts/generate-icon-code-connect.mjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-connect
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate icon mappings
        run: pnpm figma:icons

      - name: Publish to Figma
        run: pnpm figma:publish
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
