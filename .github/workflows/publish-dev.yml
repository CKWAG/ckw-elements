name: Publish Dev

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-dev
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_PROVENANCE: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute dev version
        id: version
        run: |
          set -euo pipefail
          BASE=$(node -p "require('./packages/tokens/package.json').version")
          SHA=$(printf '%s' "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          if [ -z "$BASE" ] || [ -z "$SHA" ]; then
            echo "::error::Cannot compute dev version (BASE='$BASE' SHA='$SHA')"
            exit 1
          fi
          VERSION="${BASE}-dev.${SHA}"
          echo "Computed dev version: $VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set and verify package versions
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.value }}'
          [ -n "$VERSION" ] || { echo "::error::empty version output"; exit 1; }
          for dir in packages/tokens packages/icons packages/components; do
            ( cd "$dir" && pnpm pkg set version="$VERSION" )
            GOT=$(node -p "require('./$dir/package.json').version")
            if [ "$GOT" != "$VERSION" ]; then
              echo "::error::version not applied in $dir (got '$GOT', expected '$VERSION')"
              exit 1
            fi
            echo "$dir -> $GOT"
          done

      - name: Publish to npm (dev tag)
        run: pnpm -r publish --tag dev --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
