name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check icon sources are in sync
        run: pnpm icons:check

      - name: Check published doc copies are in sync
        run: pnpm docs:check

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Check icon Code Connect mappings are up to date
        run: |
          node scripts/generate-icon-code-connect.mjs
          git diff --exit-code packages/icons/code-connect/

      - name: Build tokens
        run: pnpm --filter @ckwag/elements-tokens run build

      - name: Check CSS variables against tokens
        run: pnpm tokens:check

      - name: Build components
        run: pnpm --filter @ckwag/elements run build

      - name: Build Storybook
        run: pnpm --filter @ckwag/elements-storybook run build

      - name: Validate release configuration
        run: pnpm release:check

      - name: Dry-run npm packages
        run: pnpm release:pack

  visual-regression:
    name: Visual regression
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tokens
        run: pnpm --filter @ckwag/elements-tokens run build

      - name: Build components
        run: pnpm --filter @ckwag/elements run build

      - name: Build Storybook
        run: pnpm --filter @ckwag/elements-storybook run build

      - name: Run Chromatic
        uses: chromaui/action@v13
        env:
          CHROMATIC_BRANCH: ${{ github.event.pull_request.head.ref }}
          CHROMATIC_SHA: ${{ github.event.pull_request.head.sha }}
          CHROMATIC_SLUG: ${{ github.event_name == 'pull_request' && github.repository || '' }}
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/storybook
          storybookBuildDir: storybook-static
          exitZeroOnChanges: false
