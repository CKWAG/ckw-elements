# Pulls "Ready" icons from the CKW Elements Figma file and opens (or updates) one pull request with the changes.
# Never pushes to main and never merges: a developer reviews and merges the PR.
name: Icons sync

on:
  schedule:
    - cron: '0 3 * * *' # nightly, 03:00 UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Only report what would change, open no pull request'
        type: boolean
        default: false

concurrency:
  group: icons-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync icons from Figma
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
        run: |
          pnpm icons:sync $DRY_RUN --summary "$RUNNER_TEMP/icons-sync.md"
          cat "$RUNNER_TEMP/icons-sync.md" >> "$GITHUB_STEP_SUMMARY"

      # Code Connect mappings for icons (added by scripts/generate-icon-code-connect.mjs once that lands on main).
      - name: Regenerate icon Code Connect mappings
        if: ${{ !inputs.dry-run }}
        run: |
          if [ -f scripts/generate-icon-code-connect.mjs ] && [ -n "$(git status --porcelain -- packages/icons)" ]; then
            pnpm figma:icons
          fi

      - name: Verify generated sources and formatting
        if: ${{ !inputs.dry-run }}
        run: |
          pnpm icons:check
          pnpm format:check

      - name: Build pull request body
        if: ${{ !inputs.dry-run }}
        run: |
          {
            cat "$RUNNER_TEMP/icons-sync.md"
            echo
            echo '---'
            echo
            echo 'Opened automatically by the "Icons sync" workflow from the Figma Icons index (rows with status **Ready**).'
            echo 'Review the icons in the Storybook preview or the SVG diff, then merge. The changeset releases `@ckwag/elements-icons`.'
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Open or update the pull request
        if: ${{ !inputs.dry-run }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/icons-sync
          base: main
          commit-message: 'chore(icons): sync icons from Figma'
          title: 'chore(icons): sync icons from Figma'
          body-path: ${{ runner.temp }}/pr-body.md
          delete-branch: true
          add-paths: |
            packages/icons/**
            .changeset/icons-sync.md
