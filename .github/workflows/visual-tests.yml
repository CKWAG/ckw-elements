name: Visual Comparison Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/components/**'
      - 'packages/tokens/**'
      - 'apps/storybook/**'
      - 'tests/**'
      - 'playwright.config.ts'

concurrency:
  group: visual-tests-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  visual-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(sed -n "s/.*'@playwright\/test@\([^']*\)'.*/\1/p" pnpm-lock.yaml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Build tokens
        run: pnpm --filter @ckw-elements/tokens run build

      - name: Run visual comparison tests
        run: pnpm test:visual

      - name: Upload diff screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-comparison-diffs
          path: tests/screenshots/
          retention-days: 14
